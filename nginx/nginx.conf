# Single origin: Next.js serves pages and proxies /api/v1 itself; nginx adds
# compression, headers and sends the webhook path straight to the API.
upstream frontend { server frontend:3000; }
upstream backend  { server backend:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health { proxy_pass http://backend; }
    location /api/v1/billing/webhooks/ { proxy_pass http://backend; }
    location /api/v1/docs { proxy_pass http://backend; }
    location /api/v1/openapi.json { proxy_pass http://backend; }

    location /_next/static/ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / { proxy_pass http://frontend; }
}
