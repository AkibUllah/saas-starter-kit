# Development stack: hot reload for API and Next.js, Postgres 16, Redis 7.
#   cp .env.example .env && docker compose up --build
#   http://localhost:3000 (app)  ·  http://localhost:8000/api/v1/docs (API)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas}
      POSTGRES_DB: ${POSTGRES_DB:-saas}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-saas}:${POSTGRES_PASSWORD:-saas}@db:5432/${POSTGRES_DB:-saas}
      APP_REDIS_URL: redis://redis:6379/0
      APP_LOG_JSON: "false"
      SEED_DEMO: "true"
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- -H 0.0.0.0"
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  frontend-node-modules:
